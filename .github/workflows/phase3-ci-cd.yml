name: Phase 3 CI/CD

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI_SANDBOX_RESOURCE_GROUP: ${{ vars.CI_SANDBOX_RESOURCE_GROUP || 'rg-squad-core' }}
  CI_SANDBOX_GROUP: ${{ vars.CI_SANDBOX_GROUP || 'sg-squad-core' }}
  CI_SANDBOX_REGION: ${{ vars.CI_SANDBOX_REGION || 'eastus2' }}
  SANDBOX_IMAGE_REPOSITORY: openclaw-azure/openclaw-sandbox-core

on:
  workflow_dispatch:
    inputs:
      build_sandbox_image:
        description: Build the Sandbox disk artifact
        required: false
        default: true
        type: boolean
      sign_artifacts:
        description: Sign the sandbox metadata bundle
        required: false
        default: true
        type: boolean
      target_regions:
        description: Comma-separated distribution regions
        required: false
        default: eastus2,westcentralus
        type: string
  push:
    branches:
      - main
    paths:
      - devclaw
      - devclaw.cmd
      - scripts/**
      - src/**
      - infra/**
  schedule:
    - cron: "0 12 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install sandbox build prerequisites
        run: sudo apt-get update && sudo apt-get install -y qemu-utils

      - name: Install auth runtime dependencies
        working-directory: src
        run: npm ci --omit=dev

      - name: Syntax-check shell scripts
        run: |
          bash -n ./devclaw
          bash -n ./scripts/build-disk-image.sh

      - name: Syntax-check PowerShell scripts
        shell: pwsh
        run: |
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./infra/hooks/predeploy.ps1), [ref]$null, [ref]$null)
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./scripts/build-disk-image.ps1), [ref]$null, [ref]$null)

      - name: Run static smoke checks
        shell: pwsh
        run: .\scripts\qa\phase12-smoke.ps1 -Mode Static -NoFileReport

  prepare-regions:
    if: ((github.event_name == 'workflow_dispatch' && inputs.build_sandbox_image) || github.event_name == 'schedule') && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && secrets.AZURE_STORAGE_ACCOUNT != '' && secrets.AZURE_STORAGE_CONTAINER != ''
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.regions.outputs.matrix }}

    steps:
      - name: Derive region matrix
        id: regions
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          regions = [r.strip() for r in os.environ["TARGET_REGIONS"].split(",") if r.strip()]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"matrix={json.dumps({'region': regions})}\n")
          PY
        env:
          TARGET_REGIONS: ${{ inputs.target_regions || 'eastus2,westcentralus' }}

  build-and-sign:
    needs: validate
    if: ((github.event_name == 'workflow_dispatch' && inputs.build_sandbox_image) || github.event_name == 'schedule') && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && secrets.AZURE_STORAGE_ACCOUNT != '' && secrets.AZURE_STORAGE_CONTAINER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      HAS_AZURE_BLOB_PUBLISH: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && secrets.AZURE_STORAGE_ACCOUNT != '' && secrets.AZURE_STORAGE_CONTAINER != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate sandbox registration targets
        shell: bash
        run: |
          if ! [[ "$CI_SANDBOX_RESOURCE_GROUP" =~ ^rg-[a-z0-9-]{2,60}$ ]]; then
            echo "Invalid CI_SANDBOX_RESOURCE_GROUP: $CI_SANDBOX_RESOURCE_GROUP" >&2
            exit 1
          fi
          if ! [[ "$CI_SANDBOX_GROUP" =~ ^sg-[a-z0-9-]{2,60}$ ]]; then
            echo "Invalid CI_SANDBOX_GROUP: $CI_SANDBOX_GROUP" >&2
            exit 1
          fi
          case "$CI_SANDBOX_REGION" in
            australiaeast|eastasia|eastus|eastus2|japaneast|koreacentral|southindia|swedencentral|switzerlandnorth|uksouth|westcentralus)
              ;;
            *)
              echo "Unsupported CI_SANDBOX_REGION: $CI_SANDBOX_REGION" >&2
              exit 1
              ;;
          esac

      - name: Register ACA sandbox disk image
        if: env.HAS_AZURE_BLOB_PUBLISH == 'true'
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            acr_login_server=$(az acr list --resource-group "$CI_SANDBOX_RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
            if [ -z "$acr_login_server" ]; then
              echo "No ACR found in resource group '$CI_SANDBOX_RESOURCE_GROUP'" >&2
              exit 1
            fi
            acr_name="${acr_login_server%%.*}"
            sandbox_image="${acr_login_server}/${SANDBOX_IMAGE_REPOSITORY}:ci-${{ github.run_id }}"

            node ./scripts/generate-squad-runtime-bundle.mjs \
              --repo-root "$GITHUB_WORKSPACE" \
              --git-commit "${{ github.sha }}" \
              --git-short-commit "${GITHUB_SHA::7}" \
              --git-dirty false

            az acr build \
              --registry "$acr_name" \
              --platform linux/amd64 \
              --file "./src/Dockerfile.sandbox" \
              --image "$sandbox_image" \
              --build-arg "SQUAD_RUNTIME_GIT_COMMIT=${{ github.sha }}" \
              --build-arg "SQUAD_RUNTIME_GIT_SHORT_COMMIT=${GITHUB_SHA::7}" \
              --build-arg "SQUAD_RUNTIME_GIT_DIRTY=false" \
              "."

            python3 ./scripts/register-sandbox-disk.py \
              --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              --resource-group "$CI_SANDBOX_RESOURCE_GROUP" \
              --sandbox-group "$CI_SANDBOX_GROUP" \
              --region "$CI_SANDBOX_REGION" \
              --disk-name "openclaw-ci-${{ github.run_id }}" \
              --image "$sandbox_image" \
              --metadata-path "./_local/sandbox/disk-image-metadata.json" \
              --label squad=core \
              --label source=ci \
              --label git_commit=${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign sandbox metadata
        if: github.event_name == 'schedule' || inputs.sign_artifacts
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign-blob --yes \
            --output-signature ./_local/sandbox/disk-image-metadata.sig \
            --output-certificate ./_local/sandbox/disk-image-metadata.pem \
            ./_local/sandbox/disk-image-metadata.json

      - name: Build distribution manifest
        env:
          TARGET_REGIONS: ${{ inputs.target_regions || 'eastus2,westcentralus' }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          targets = [r.strip() for r in os.environ["TARGET_REGIONS"].split(",") if r.strip()]
          metadata = json.loads(pathlib.Path("./_local/sandbox/disk-image-metadata.json").read_text(encoding="utf-8"))
          payload = {
              "artifact": "_local/sandbox/disk-image-metadata.json",
              "image": metadata.get("source_image", ""),
              "signature": "_local/sandbox/disk-image-metadata.sig",
              "certificate": "_local/sandbox/disk-image-metadata.pem",
              "targets": targets,
          }
          pathlib.Path("./_local/sandbox/phase3-distribution.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload signed sandbox bundle
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-signed-bundle
          path: |
            ./_local/sandbox/disk-image-metadata.json
            ./_local/sandbox/disk-image-metadata.sig
            ./_local/sandbox/disk-image-metadata.pem
            ./_local/sandbox/phase3-distribution.json

  distribute:
    needs:
      - build-and-sign
      - prepare-regions
    if: ((github.event_name == 'workflow_dispatch' && inputs.build_sandbox_image) || github.event_name == 'schedule') && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && secrets.AZURE_STORAGE_ACCOUNT != '' && secrets.AZURE_STORAGE_CONTAINER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      HAS_AZURE_BLOB_PUBLISH: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && secrets.AZURE_STORAGE_ACCOUNT != '' && secrets.AZURE_STORAGE_CONTAINER != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-regions.outputs.matrix) }}

    steps:
      - name: Download signed bundle
        uses: actions/download-artifact@v4
        with:
          name: sandbox-signed-bundle
          path: ./bundle

      - name: Stage region bundle
        shell: bash
        run: |
          mkdir -p "./dist/${{ matrix.region }}"
          cp ./bundle/disk-image-metadata.json "./dist/${{ matrix.region }}/"
          cp ./bundle/disk-image-metadata.sig "./dist/${{ matrix.region }}/"
          cp ./bundle/disk-image-metadata.pem "./dist/${{ matrix.region }}/"
          cp ./bundle/phase3-distribution.json "./dist/${{ matrix.region }}/"
          echo "Staged bundle for region: ${{ matrix.region }}"

      - name: Upload regional bundle
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-bundle-${{ matrix.region }}
          path: ./dist/${{ matrix.region }}

      - name: Azure login
        if: env.HAS_AZURE_BLOB_PUBLISH == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Azure Blob publish target
        if: env.HAS_AZURE_BLOB_PUBLISH == 'true'
        id: storage_target
        uses: azure/cli@v2
        with:
          inlineScript: |
            set +e
            account_exists=$(az storage account show \
              --name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --query name -o tsv 2>/dev/null)
            rc=$?
            set -e

            if [ $rc -ne 0 ] || [ -z "$account_exists" ]; then
              echo "can_publish=false" >> "$GITHUB_OUTPUT"
              echo "Storage account '${{ secrets.AZURE_STORAGE_ACCOUNT }}' is not available; skipping blob publish."
              exit 0
            fi

            echo "can_publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish region bundle to Azure Blob
        if: env.HAS_AZURE_BLOB_PUBLISH == 'true' && steps.storage_target.outputs.can_publish == 'true'
        uses: azure/cli@v2
        with:
          inlineScript: |
            az storage container create \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --name "${{ secrets.AZURE_STORAGE_CONTAINER }}" \
              --auth-mode login >/dev/null

            az storage blob upload-batch \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --destination "${{ secrets.AZURE_STORAGE_CONTAINER }}/sandbox/${{ matrix.region }}" \
              --source "./dist/${{ matrix.region }}" \
              --auth-mode login \
              --overwrite

            uploaded_count=$(az storage blob list \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --container-name "${{ secrets.AZURE_STORAGE_CONTAINER }}" \
              --prefix "sandbox/${{ matrix.region }}/" \
              --auth-mode login \
              --query "length(@)" -o tsv)

            if [ "$uploaded_count" -lt 1 ]; then
              echo "No blobs found after publish for region: ${{ matrix.region }}" >&2
              exit 1
            fi

      - name: Skip blob verification when no storage target exists
        if: env.HAS_AZURE_BLOB_PUBLISH == 'true' && steps.storage_target.outputs.can_publish != 'true'
        run: echo "Azure Blob publish skipped because the storage account target does not exist."
